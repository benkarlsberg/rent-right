name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.gate.outputs.deploy }}
    steps:
      - id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DATABASE_URL SUPABASE_URL SUPABASE_ANON_KEY DATA_ENCRYPTION_KEY AUTH_SECRET; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              echo "Secret $name is not set."
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare or Supabase secrets are missing. Skipping deploy."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Cloudflare deploy tools
        run: |
          npm install --no-save @opennextjs/cloudflare wrangler
          npx tsx scripts/patch-opennext-externals.ts
      - name: Resolve the database URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: npx tsx scripts/resolve-database-url.ts
      - name: Time signed /me before deploy
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          ME_PHASE: before
        run: |
          if [ -f .database-url ]; then export DATABASE_URL="$(cat .database-url)"; fi
          npx tsx scripts/time-signed-me.ts
      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -f .database-url ]; then export DATABASE_URL="$(cat .database-url)"; fi
          npm run db:migrate
      - name: Build the Worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          OPEN_NEXT_CLOUDFLARE: "1"
        run: |
          if [ -f .database-url ]; then export DATABASE_URL="$(cat .database-url)"; fi
          if [ -z "$NEXT_PUBLIC_APP_URL" ]; then
            export NEXT_PUBLIC_APP_URL="https://app.rentrightportal.com"
          fi
          export APP_URL="$NEXT_PUBLIC_APP_URL"
          npx opennextjs-cloudflare build
      - name: Attach Hyperdrive
        id: hyperdrive
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          if [ -f .database-url ]; then export DATABASE_URL="$(cat .database-url)"; fi
          npx tsx scripts/ensure-hyperdrive.ts
      - name: Register a workers.dev subdomain
        if: steps.hyperdrive.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx tsx scripts/register-workers-subdomain.ts
      - name: Deploy the API Worker
        if: steps.hyperdrive.outcome == 'success'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -o pipefail
          if [ -f .database-url ]; then export DATABASE_URL="$(cat .database-url)"; fi
          if [ -n "$DATABASE_URL" ]; then
            export CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE="$DATABASE_URL"
          fi
          npx opennextjs-cloudflare deploy | tee deploy.log
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -1 || true)
          if [ -z "$url" ]; then
            echo "Could not read the Worker URL from the deploy log."
            exit 1
          fi
          echo "API_URL=$url" >> "$GITHUB_ENV"
          echo "Worker URL: $url"
      - name: Push Worker secrets
        if: steps.hyperdrive.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          EMAIL_WEBHOOK_SECRET: ${{ secrets.EMAIL_WEBHOOK_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          RELAY_DOMAIN: ${{ secrets.RELAY_DOMAIN }}
          REVIEWER_LOGIN: ${{ secrets.REVIEWER_LOGIN }}
          REVIEWER_EMAIL: ${{ secrets.REVIEWER_EMAIL }}
          REVIEWER_CODE: ${{ secrets.REVIEWER_CODE }}
          API_URL: ${{ env.API_URL }}
        run: |
          if [ -f .database-url ]; then export DATABASE_URL="$(cat .database-url)"; fi
          if [ -z "$NEXT_PUBLIC_APP_URL" ]; then
            export NEXT_PUBLIC_APP_URL="https://app.rentrightportal.com"
          fi
          export APP_URL="$NEXT_PUBLIC_APP_URL"
          if [ -z "$RELAY_DOMAIN" ]; then
            export RELAY_DOMAIN="rentrightportal.com"
          fi
          node --input-type=module -e '
            import { writeFileSync } from "fs";
            const keys = ["DATABASE_URL","SUPABASE_URL","SUPABASE_ANON_KEY","SUPABASE_SERVICE_ROLE_KEY","DATA_ENCRYPTION_KEY","AUTH_SECRET","GEMINI_API_KEY","RESEND_API_KEY","RESEND_FROM","NEXT_PUBLIC_APP_URL","APP_URL","EMAIL_WEBHOOK_SECRET","CRON_SECRET","RELAY_DOMAIN","REVIEWER_LOGIN","REVIEWER_EMAIL","REVIEWER_CODE"];
            const body = {};
            for (const key of keys) if (process.env[key]) body[key] = process.env[key];
            writeFileSync("worker-secrets.json", JSON.stringify(body));
          '
          npx wrangler secret bulk worker-secrets.json
          rm -f worker-secrets.json
      - name: Time signed /me after deploy
        if: steps.hyperdrive.outcome == 'success'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          ME_PHASE: after
          ME_MAX_MS: "1000"
        run: |
          if [ -f .database-url ]; then export DATABASE_URL="$(cat .database-url)"; fi
          ok=0
          for attempt in 1 2 3 4 5 6; do
            echo "attempt: $attempt"
            if npx tsx scripts/time-signed-me.ts; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = 1
      - name: Attach custom domains
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx tsx scripts/attach-custom-domains.ts
      - name: Choose the API URL for the phone app
        env:
          API_URL: ${{ env.API_URL }}
        run: |
          custom="https://api.rentrightportal.com"
          if node --input-type=module -e '
            const response = await fetch("https://api.rentrightportal.com/api/v1", { signal: AbortSignal.timeout(20000) });
            if (!response.ok) process.exit(1);
            const body = await response.json();
            if (body.name !== "Rent Right") process.exit(1);
          '; then
            echo "EXPO_PUBLIC_API_URL=$custom" >> "$GITHUB_ENV"
            echo "Expo will call $custom."
          else
            echo "EXPO_PUBLIC_API_URL=$API_URL" >> "$GITHUB_ENV"
            echo "api.rentrightportal.com is not answering yet. Expo will call $API_URL."
          fi
      - name: Install Expo and export web
        working-directory: mobile
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
          EXPO_PUBLIC_API_URL: ${{ env.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_GOOGLE_AUTH: ${{ vars.EXPO_PUBLIC_GOOGLE_AUTH || secrets.EXPO_PUBLIC_GOOGLE_AUTH }}
          EXPO_PUBLIC_APPLE_AUTH: ${{ vars.EXPO_PUBLIC_APPLE_AUTH || secrets.EXPO_PUBLIC_APPLE_AUTH }}
        run: |
          npm ci
          npx tsx ../scripts/write-legal-pages.ts
          npx expo export --platform web
          npx tsx ../scripts/write-legal-pages.ts --inject
      - name: Create the Pages project
        id: pages
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx tsx scripts/create-pages-project.ts
      - name: Deploy Expo web to Pages
        if: steps.pages.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler pages deploy mobile/dist --project-name rent-right-web --branch main --commit-dirty=true | tee pages.log
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.pages\.dev' pages.log | head -1 || true)
          echo "Web URL: ${url:-https://rent-right-web.pages.dev}"
      - name: Deploy Expo web as a static Worker
        if: steps.pages.outcome != 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler deploy --config wrangler.web.jsonc | tee web.log
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' web.log | head -1 || true)
          if [ -z "$url" ]; then
            echo "Could not read the web URL from the deploy log."
            exit 1
          fi
          echo "Web URL: $url"
      - name: Deploy the inbound mail worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EMAIL_WEBHOOK_SECRET: ${{ secrets.EMAIL_WEBHOOK_SECRET }}
        run: |
          if [ -z "$EMAIL_WEBHOOK_SECRET" ]; then
            echo "EMAIL_WEBHOOK_SECRET is not set. Skipping the inbound mail worker."
            exit 0
          fi
          npx wrangler deploy --config email/wrangler.jsonc
          printf '%s' "$EMAIL_WEBHOOK_SECRET" | npx wrangler secret put EMAIL_WEBHOOK_SECRET --config email/wrangler.jsonc
      - name: Remove the resolved database URL
        if: always()
        run: rm -f .database-url
